[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-audio-companion"
version = "0.1.0"
description = "Local desktop sound activity visualization; no game integration"
requires-python = ">=3.11,<3.15"
dependencies = [
  "numpy>=2.1,<3",
  "PySide6>=6.8,<6.12",
  "scipy>=1.14,<2",
  "PyAudioWPatch>=0.2.12.7,<0.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<0.16"]
classifier = ["torch>=2.6,<3", "transformers>=4.48,<5", "huggingface-hub>=0.28,<1", "safetensors>=0.5,<1"]
training = ["av>=16,<20"]

[project.scripts]
arc-audio = "arc_audio.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
